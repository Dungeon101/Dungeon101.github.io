<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Dungeon101</title>
  <meta name="description" content="A turn-based roguelite in the browser: nine floors, three bosses, permadeath and a sanctuary that keeps your progress. Free, no install.">
  <meta name="theme-color" content="#0b0a0d">
  <meta property="og:title" content="Dungeon101">
  <meta property="og:description" content="Nine floors. Three tyrants. One torch. A turn-based roguelite you play in the browser.">
  <meta property="og:image" content="https://dungeon101.github.io/assets/img/og.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/img/key-art.webp">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="title">
  <canvas id="embers" aria-hidden="true"></canvas>

  <section id="s-title" class="screen on">
    <div class="keyart" aria-hidden="true"></div>
    <div class="title-box">
      <h1 class="logo"><span>Dungeon</span><em>101</em></h1>
      <p class="tagline"></p>
      <nav class="menu"></nav>
      <div id="account"></div>
    </div>
    <div id="toggles"></div>
  </section>

  <section id="s-select" class="screen page"><div class="body"></div></section>
  <section id="s-sanctuary" class="screen page"><div class="body"></div></section>
  <section id="s-hall" class="screen page"><div class="body"></div></section>

  <section id="s-game" class="screen">
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="hero" class="glass">
        <img class="face" alt="" width="56" height="56">
        <div class="info">
          <div class="top"><b class="name"></b><span class="lvl"></span></div>
          <div id="hp" class="bar hp"><i></i><span class="bt"></span></div>
          <div id="xp" class="bar xp"><i></i></div>
          <div class="st"></div>
        </div>
      </div>
      <div id="focus" class="glass">
        <img class="face" alt="" width="34" height="34">
        <div class="info"><span class="n"></span><div class="bar foe"><i></i><span class="bt"></span></div></div>
      </div>
      <div id="bossbar"><span class="n"></span><div class="bar boss"><i></i></div></div>
      <div id="side">
        <div id="where" class="glass"></div>
        <div id="mapbox" class="glass"><canvas id="minimap"></canvas></div>
        <div class="buttons">
          <button class="round" data-go="map" data-icon="map" aria-label="Map"></button>
          <button class="round" data-go="inv" data-icon="backpack" aria-label="Inventory"></button>
          <button class="round" id="btn-talents" data-go="tal" data-icon="sparkles" aria-label="Talents"><em></em></button>
          <button class="round" data-go="pause" data-icon="settings" aria-label="Pause"></button>
        </div>
      </div>
      <div id="log" aria-live="polite"></div>
      <div id="skills"></div>
      <div id="hint"></div>
      <div id="floor-card"></div>
      <div id="boss-card"></div>
      <div id="toasts"></div>
    </div>
  </section>

  <div id="overlay" class="overlay"></div>
  <div id="tip"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
